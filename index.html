<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>养鸭子 · 课堂互动</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#2b3440;background:linear-gradient(180deg,#bfe6ff 0%,#dff1ff 32%,#fff8e8 100%);background-attachment:fixed;min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
[hidden]{display:none !important}
.screen{min-height:100dvh;display:flex;flex-direction:column}
.home-inner{margin:auto;text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo-duck{font-size:88px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.home-inner h1{font-size:46px;margin:8px 0 0;letter-spacing:4px;background:linear-gradient(135deg,#ffb703,#fb8500);-webkit-background-clip:text;background-clip:text;color:transparent}
.home-inner .sub{color:#7b8794;font-size:15px;margin:6px 0 26px;letter-spacing:.5px}
.home-btns{display:flex;flex-direction:column;gap:14px;width:min(320px,86vw)}
.btn{display:block;text-align:center;padding:16px 22px;border-radius:18px;font-size:17px;font-weight:700;text-decoration:none;transition:transform .18s,box-shadow .18s,filter .18s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#ffc93c,#f79b12);color:#5a3200;box-shadow:0 10px 22px rgba(247,155,18,.35)}
.btn-ghost{background:rgba(255,255,255,.8);color:#2b3440;box-shadow:0 6px 18px rgba(120,150,190,.18),inset 0 0 0 2px #fff}
.btn-danger{background:#ffe3ea;color:#c9184a;font-weight:700;box-shadow:none}
.count-picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 4px;max-width:560px}
.count-btn{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(120,150,190,.16),inset 0 0 0 2px #fff;font-size:20px;font-weight:900;color:#7b8794;transition:transform .16s,box-shadow .16s;display:grid;place-items:center}
.count-btn:active{transform:scale(.94)}
.count-btn.active{background:linear-gradient(135deg,#ffc93c,#f79b12);color:#5a3200;box-shadow:0 10px 22px rgba(247,155,18,.4);transform:scale(1.08)}
.stage-header{display:flex;align-items:center;gap:14px;padding:16px 24px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:2px}
.brand-duck{font-size:28px}
.stage-tools{margin-left:auto}
.icon-btn{width:42px;height:42px;border-radius:14px;font-size:20px;background:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(120,150,190,.2);display:grid;place-items:center;transition:transform .16s}
.icon-btn:active{transform:scale(.9)}
.settings-panel{margin:0 24px 14px;padding:16px 20px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 10px 28px rgba(120,150,190,.18);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.settings-panel label{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.settings-panel input[type=range]{width:180px;accent-color:#f79b12}
.settings-hint{width:100%;font-size:13px;color:#7b8794;font-weight:600;line-height:1.7}
.settings-hint b{color:#f79b12}
.stage-grid{flex:1;display:grid;gap:16px;align-content:start;justify-items:center;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:4px 22px 30px}
.stage-grid.compact{grid-template-columns:repeat(auto-fit,minmax(160px,1fr)) !important;gap:10px;padding:4px 14px 24px}
.stage-grid.compact .duck-card{max-width:220px;padding:8px 10px 10px;border-radius:18px}
.stage-grid.compact .duck-name{font-size:16px;max-width:130px}
.stage-grid.compact .group-tag{font-size:10px;padding:1px 6px}
.stage-grid.compact .card-head{gap:5px}
.stage-grid.compact .duck-stage{height:138px}
.stage-grid.compact .duck-wrap{width:118px;height:128px}
.stage-grid.compact .duck-svg{width:118px;height:118px}
.stage-grid.compact .ruler{height:128px;width:34px}
.stage-grid.compact .bean-num{font-size:22px}
.stage-grid.compact .bean-ico{font-size:13px}
.stage-grid.compact .bean-den{font-size:11px}
.stage-grid.compact .ctrl-btn{width:30px;height:30px;font-size:14px;border-radius:9px}
.stage-grid.compact .card-controls{gap:5px;margin-top:6px}
.stage-grid.compact .group-name-input{width:120px;font-size:15px;padding:3px 6px}
.stage-grid.ultra{grid-template-columns:repeat(auto-fit,minmax(140px,1fr)) !important;gap:8px;padding:4px 10px 18px}
.stage-grid.ultra .duck-card{max-width:180px;padding:6px 6px 8px;border-radius:14px}
.stage-grid.ultra .duck-name{font-size:13px;max-width:96px;letter-spacing:0}
.stage-grid.ultra .group-tag{font-size:9px;padding:1px 5px;border-radius:6px}
.stage-grid.ultra .card-head{gap:4px}
.stage-grid.ultra .duck-stage{height:108px;margin:2px 0 0}
.stage-grid.ultra .duck-wrap{width:92px;height:100px}
.stage-grid.ultra .duck-svg{width:92px;height:92px}
.stage-grid.ultra .ruler{height:100px;width:26px}
.stage-grid.ultra .ruler-track{width:7px;left:2px}
.stage-grid.ultra .ruler-ticks{left:9px}
.stage-grid.ultra .tick{width:7px;height:2px}
.stage-grid.ultra .tick.major{width:11px}
.stage-grid.ultra .tick-label{font-size:8px;left:13px}
.stage-grid.ultra .bean-num{font-size:17px}
.stage-grid.ultra .bean-ico{font-size:11px}
.stage-grid.ultra .bean-den{font-size:10px}
.stage-grid.ultra .bean-row{gap:2px}
.stage-grid.ultra .ctrl-btn{width:26px;height:26px;font-size:12px;border-radius:8px}
.stage-grid.ultra .card-controls{gap:4px;margin-top:4px}
.stage-grid.ultra .group-name-input{width:88px;font-size:12px;padding:2px 4px}
.duck-card{width:100%;max-width:320px;padding:12px 14px 14px;border-radius:24px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);box-shadow:0 10px 26px rgba(120,150,190,.16),inset 0 0 0 2px rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;transition:box-shadow .3s,transform .3s}
.duck-card.grown{box-shadow:0 10px 26px rgba(247,155,18,.3),inset 0 0 0 3px #ffd166;background:linear-gradient(180deg,rgba(255,250,230,.95),rgba(255,255,255,.8))}
.card-head{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;min-height:32px}
.duck-name{font-size:21px;font-weight:900;letter-spacing:1px;color:#2b3440;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:2px 8px;border-radius:10px;border:1px dashed transparent;transition:background .15s,border-color .15s,box-shadow .15s}
.duck-name:hover{background:#fff6de;border-color:#ffd166;box-shadow:0 3px 10px rgba(247,155,18,.2)}
.group-tag{font-size:12px;font-weight:900;color:#94a3b8;background:#eef3f9;padding:3px 8px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;border:1px dashed transparent;white-space:nowrap;line-height:1;user-select:none}
.group-tag:hover{background:#dbe7f5;color:#4f6784;border-color:#b8ccdf}
.group-name-input{width:170px;max-width:200px;padding:4px 10px;border:2px solid #ffc93c;border-radius:10px;font-size:19px;font-weight:900;color:#2b3440;background:#fff;outline:none;text-align:center;box-shadow:0 6px 16px rgba(247,155,18,.3);font-family:inherit}
.duck-stage{display:flex;align-items:flex-end;justify-content:center;gap:0;height:180px;margin:6px 0 2px;position:relative}
.duck-wrap{width:160px;height:170px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.duck-svg{width:160px;height:160px;transform-origin:bottom center;transform:scale(var(--s,.35));transition:transform .85s cubic-bezier(.34,1.56,.64,1)}
.duck-svg svg{width:100%;height:100%;display:block;overflow:visible}
.ruler{position:relative;width:42px;height:170px;flex:none}
.ruler-track{position:absolute;left:2px;top:0;bottom:0;width:9px;background:#e4ecf4;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,150,190,.25)}
.ruler-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#ffd166,#f79b12);border-radius:6px;transition:height .85s cubic-bezier(.34,1.56,.64,1)}
.ruler-ticks{position:absolute;left:11px;top:0;bottom:0;right:0}
.tick{position:absolute;left:0;width:9px;height:2px;background:#c3d0dd;border-radius:2px}
.tick.major{width:14px;background:#9fb3c8}
.tick-label{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:#a8b6c6;line-height:1}
.tick.major .tick-label{color:#7b8794}
.bean-row{display:flex;align-items:baseline;gap:3px;margin-top:2px}
.bean-ico{font-size:16px}
.bean-num{font-size:28px;font-weight:900;color:#f79b12;letter-spacing:-.5px;transition:transform .25s,color .25s}
.bean-num.bump{animation:beanBump .35s ease}
@keyframes beanBump{0%,100%{transform:scale(1)}40%{transform:scale(1.4);color:#ff7a00}}
.bean-den{font-size:13px;font-weight:700;color:#b8c4d2}
.card-controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.ctrl-btn{width:34px;height:34px;border-radius:11px;font-size:16px;font-weight:900;display:grid;place-items:center;box-shadow:0 3px 8px rgba(120,150,190,.2),inset 0 0 0 1px rgba(255,255,255,.9);transition:transform .12s,box-shadow .12s,filter .12s;user-select:none}
.ctrl-btn:active{transform:scale(.88)}
.ctrl-add{color:#f79b12;background:linear-gradient(135deg,#fff3d6,#ffe9b8)}
.ctrl-puke{background:linear-gradient(135deg,#ffe0e6,#ffc4d0);color:#c9184a;font-size:16px}
.ctrl-feed{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);color:#2e7d32;font-size:16px}
.ctrl-feed.active{background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;animation:feedPulse 1.4s ease-in-out infinite}
@keyframes feedPulse{0%,100%{box-shadow:0 3px 8px rgba(76,175,80,.4)}50%{box-shadow:0 3px 18px rgba(76,175,80,.75)}}
.stu-header{padding:16px 20px 6px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:2px}
.stu-header .brand-duck{font-size:22px}
.stu-refresh{margin-left:auto;width:38px;height:38px;border-radius:12px;font-size:17px;background:rgba(255,255,255,.85);color:#4f6784;box-shadow:0 4px 12px rgba(120,150,190,.2);display:grid;place-items:center;transition:transform .16s}
.stu-refresh:active{transform:scale(.9) rotate(-90deg)}
.stu-refresh.spin{animation:spin .8s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#groupPicker{padding:10px 20px 30px}
#groupPicker h2{font-size:19px;margin:14px 0 8px;font-weight:800}
.gp-status{font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:16px;line-height:1.6}
.gp-status b{color:#f79b12}
.group-pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.group-pick-btn{padding:16px 12px;border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(120,150,190,.16),inset 0 0 0 2px #fff;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .16s}
.group-pick-btn:active{transform:scale(.95)}
.gp-name{font-size:16px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-meta{font-size:12px;color:#94a3b8;font-weight:600}
#duckSetup,#duckLobby{padding:0 20px 40px;display:flex;flex-direction:column;align-items:center}
.back-btn{align-self:flex-start;font-size:13px;font-weight:700;color:#7b8794;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.7);margin-bottom:10px}
.setup-head{display:flex;align-items:center;width:100%;gap:8px;margin-bottom:8px}
.setup-head .back-btn{margin-bottom:0}
.edit-btn{margin-left:auto;font-size:13px;font-weight:700;color:#4f6784;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(120,150,190,.16)}
.edit-btn:active{transform:scale(.95)}
.setup-duck-stage{display:flex;align-items:flex-end;justify-content:center;height:180px;width:100%;margin-bottom:8px}
.setup-duck-stage .duck-wrap{width:160px;height:170px}
.setup-duck-stage .duck-svg{width:160px;height:160px}
.setup-title{font-size:17px;font-weight:900;color:#2b3440;margin:8px 0 4px;letter-spacing:1px}
.setup-sub{font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:22px}
.my-duck-stage{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:200px;position:relative;width:100%;margin-bottom:2px}
.my-beans{font-size:18px;font-weight:800;color:#f79b12;margin:6px 0 22px;background:rgba(255,255,255,.8);padding:6px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(120,150,190,.14)}
.my-controls{width:100%;display:flex;flex-direction:column;gap:16px;margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:13px;font-weight:700;color:#7b8794;padding-left:4px}
.field input{width:100%;padding:14px 16px;border-radius:16px;border:2px solid #e4ecf4;background:rgba(255,255,255,.9);font-size:17px;font-weight:700;outline:none;transition:border-color .2s}
.field input:focus{border-color:#ffc93c}
.color-row{display:flex;gap:10px;flex-wrap:wrap;padding-left:4px}
.color-dot{width:42px;height:42px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.12),inset 0 0 0 2px rgba(255,255,255,.7);transition:transform .16s,box-shadow .16s;position:relative}
.color-dot.active{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 6px #ffc93c}
.big-btn{width:100%;padding:20px;border-radius:24px;font-size:19px;font-weight:900;letter-spacing:1px;color:#5a3200;background:linear-gradient(135deg,#ffd166,#f79b12);box-shadow:0 12px 28px rgba(247,155,18,.4);transition:transform .16s,filter .16s,background .2s,color .2s}
.big-btn:active{transform:scale(.96)}
.big-btn:disabled{background:#e4ecf4;color:#a8b6c6;box-shadow:none;transform:none;cursor:default}
.big-btn.gray{background:#e4ecf4;color:#a8b6c6;box-shadow:none}
.big-btn.green{background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;box-shadow:0 12px 28px rgba(67,160,71,.4);animation:btnGlow 1.6s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 12px 28px rgba(67,160,71,.4)}50%{box-shadow:0 12px 36px rgba(67,160,71,.75)}}
#boxGridScreen{position:fixed;inset:0;background:linear-gradient(180deg,#bfe6ff 0%,#dff1ff 32%,#fff8e8 100%);z-index:50;padding:24px 20px;display:flex;flex-direction:column;align-items:center;overflow-y:auto}
.box-grid-head{text-align:center;margin:16px 0 22px}
.box-grid-head h2{font-size:22px;font-weight:900;margin:0 0 6px;letter-spacing:2px}
.box-grid-head p{font-size:13px;color:#94a3b8;font-weight:600;margin:0}
.box-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:520px;margin-bottom:22px}
.box-cell{aspect-ratio:1;border-radius:20px;background:linear-gradient(160deg,#ffd166,#f4a261);box-shadow:0 8px 20px rgba(244,162,97,.35),inset 0 -6px 0 rgba(0,0,0,.08);display:grid;place-items:center;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .2s;position:relative;overflow:hidden;font-family:inherit;color:inherit}
.box-cell::before{content:'?';font-size:48px;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 4px 0 rgba(0,0,0,.1)}
.box-cell:active{transform:scale(.94)}
.box-cell.opened{cursor:default;animation:cellOpen .45s ease}
.box-cell.opened::before{display:none}
.box-cell.disabled{pointer-events:none;opacity:.4}
.box-cell.opened.good{background:linear-gradient(160deg,#ffd166,#f79b12);box-shadow:0 8px 20px rgba(247,155,18,.5),inset 0 0 0 3px rgba(255,255,255,.6)}
.box-cell.opened.bad{background:linear-gradient(160deg,#ffb3c1,#ef476f);box-shadow:0 8px 20px rgba(239,71,111,.4),inset 0 0 0 3px rgba(255,255,255,.6)}
.box-cell.opened.empty{background:linear-gradient(160deg,#dde7f0,#b8c4d2);box-shadow:0 8px 20px rgba(150,170,190,.3),inset 0 0 0 3px rgba(255,255,255,.6)}
@keyframes cellOpen{0%{transform:scale(1) rotateY(0)}50%{transform:scale(1.15) rotateY(90deg)}100%{transform:scale(1) rotateY(0)}}
.box-cell .result-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.box-cell .result-icon{font-size:22px;line-height:1}
.box-cell .result-num{font-size:20px;line-height:1;letter-spacing:-1px}
.box-cell .result-txt{font-size:9px;opacity:.9}
.particle{position:absolute;font-size:20px;pointer-events:none;z-index:5;animation:fly .95s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
.puking{animation:pukeShake .8s ease-in-out}
@keyframes pukeShake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-6px) rotate(-4deg)}30%{transform:translateX(6px) rotate(4deg)}45%{transform:translateX(-5px) rotate(-3deg)}60%{transform:translateX(5px) rotate(3deg)}80%{transform:translateX(-2px) rotate(1deg)}}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(43,52,64,.92);color:#fff;font-size:14px;font-weight:700;padding:12px 22px;border-radius:999px;z-index:200;animation:toastIn .25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.duck-nickname{font-size:12px;color:#94a3b8;font-weight:700;margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
@media (max-width:520px){
  .stage-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px 24px}
  .duck-card{padding:10px 8px 12px;border-radius:18px}
  .duck-name{font-size:15px;max-width:130px}
  .group-tag{font-size:10px}
  .duck-stage{height:150px}
  .duck-wrap{width:120px;height:140px}
  .duck-svg{width:130px;height:130px}
  .ruler{height:140px;width:36px}
  .bean-num{font-size:22px}
  .count-btn{width:48px;height:48px;font-size:18px}
  .ctrl-btn{width:30px;height:30px;font-size:14px}
  .box-cell::before{font-size:36px}
  .box-cell .result-num{font-size:20px}
  .box-cell .result-icon{font-size:22px}
}
#liveDrawOverlay{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,rgba(191,230,255,.97),rgba(223,241,255,.97) 32%,rgba(255,248,232,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.live-head{font-size:28px;font-weight:900;margin-bottom:24px;color:#2b3440;letter-spacing:2px}
.live-head span{color:#f79b12}
.live-box-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:640px}
.live-box-cell{aspect-ratio:1;border-radius:22px;background:linear-gradient(160deg,#ffd166,#f4a261);box-shadow:0 12px 30px rgba(244,162,97,.4),inset 0 -8px 0 rgba(0,0,0,.08);display:grid;place-items:center;position:relative;border:3px solid rgba(255,255,255,.5);font-size:60px;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 4px 0 rgba(0,0,0,.12)}
.live-box-cell.opened{animation:cellOpen .5s cubic-bezier(.34,1.56,.64,1)}
.live-box-cell.opened.good{background:linear-gradient(160deg,#ffd166,#f79b12)}
.live-box-cell.opened.bad{background:linear-gradient(160deg,#ffb3c1,#ef476f)}
.live-box-cell.opened.empty{background:linear-gradient(160deg,#dde7f0,#b8c4d2)}
.live-box-cell .result-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.25);animation:resultPop .5s both;animation-delay:.2s}
@keyframes resultPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.live-box-cell .result-icon{font-size:40px}
.live-box-cell .result-num{font-size:44px;line-height:1;letter-spacing:-2px}
.live-box-cell .result-txt{font-size:14px;opacity:.9}
