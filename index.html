<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>养鸭子 · 课堂互动</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#2b3440;background:linear-gradient(180deg,#bfe6ff 0%,#dff1ff 32%,#fff8e8 100%);
  background-attachment:fixed;min-height:100dvh;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
[hidden]{display:none !important}

.screen{min-height:100dvh;display:flex;flex-direction:column}
.home-inner{margin:auto;text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo-duck{font-size:88px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.home-inner h1{font-size:46px;margin:8px 0 0;letter-spacing:4px;background:linear-gradient(135deg,#ffb703,#fb8500);-webkit-background-clip:text;background-clip:text;color:transparent}
.home-inner .sub{color:#7b8794;font-size:15px;margin:6px 0 26px;letter-spacing:.5px}
.home-btns{display:flex;flex-direction:column;gap:14px;width:min(320px,86vw)}
.btn{display:block;text-align:center;padding:16px 22px;border-radius:18px;font-size:17px;font-weight:700;text-decoration:none;transition:transform .18s,box-shadow .18s,filter .18s}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#ffc93c,#f79b12);color:#5a3200;box-shadow:0 10px 22px rgba(247,155,18,.35)}
.btn-ghost{background:rgba(255,255,255,.8);color:#2b3440;box-shadow:0 6px 18px rgba(120,150,190,.18),inset 0 0 0 2px #fff}
.btn-danger{background:#ffe3ea;color:#c9184a;font-weight:700;box-shadow:none}

.count-picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 4px;max-width:560px}
.count-btn{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(120,150,190,.16),inset 0 0 0 2px #fff;font-size:20px;font-weight:900;color:#7b8794;transition:transform .16s,box-shadow .16s;display:grid;place-items:center}
.count-btn:active{transform:scale(.94)}
.count-btn.active{background:linear-gradient(135deg,#ffc93c,#f79b12);color:#5a3200;box-shadow:0 10px 22px rgba(247,155,18,.4);transform:scale(1.08)}

.stage-header{display:flex;align-items:center;gap:14px;padding:16px 24px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:2px}
.brand-duck{font-size:28px}
.stage-tools{margin-left:auto}
.icon-btn{width:42px;height:42px;border-radius:14px;font-size:20px;background:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(120,150,190,.2);display:grid;place-items:center;transition:transform .16s}
.icon-btn:active{transform:scale(.9)}

.settings-panel{margin:0 24px 14px;padding:16px 20px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 10px 28px rgba(120,150,190,.18);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.settings-panel label{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.settings-panel input[type=range]{width:180px;accent-color:#f79b12}
.settings-hint{width:100%;font-size:13px;color:#7b8794;font-weight:600;line-height:1.7}
.settings-hint b{color:#f79b12}

.stage-grid{flex:1;display:grid;gap:16px;align-content:start;justify-items:center;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding:4px 22px 30px}
.stage-grid.compact{grid-template-columns:repeat(auto-fit,minmax(160px,1fr)) !important;gap:10px;padding:4px 14px 24px}
.stage-grid.compact .duck-card{max-width:220px;padding:8px 10px 10px;border-radius:18px}
.stage-grid.compact .duck-name{font-size:16px;max-width:130px}
.stage-grid.compact .group-tag{font-size:10px;padding:1px 6px}
.stage-grid.compact .card-head{gap:5px}
.stage-grid.compact .duck-stage{height:138px}
.stage-grid.compact .duck-wrap{width:118px;height:128px}
.stage-grid.compact .duck-svg{width:118px;height:118px}
.stage-grid.compact .ruler{height:128px;width:34px}
.stage-grid.compact .bean-num{font-size:22px}
.stage-grid.compact .bean-ico{font-size:13px}
.stage-grid.compact .bean-den{font-size:11px}
.stage-grid.compact .ctrl-btn{width:30px;height:30px;font-size:14px;border-radius:9px}
.stage-grid.compact .card-controls{gap:5px;margin-top:6px}
.stage-grid.compact .group-name-input{width:120px;font-size:15px;padding:3px 6px}

.stage-grid.ultra{grid-template-columns:repeat(auto-fit,minmax(140px,1fr)) !important;gap:8px;padding:4px 10px 18px}
.stage-grid.ultra .duck-card{max-width:180px;padding:6px 6px 8px;border-radius:14px}
.stage-grid.ultra .duck-name{font-size:13px;max-width:96px;letter-spacing:0}
.stage-grid.ultra .group-tag{font-size:9px;padding:1px 5px;border-radius:6px}
.stage-grid.ultra .card-head{gap:4px}
.stage-grid.ultra .duck-stage{height:108px;margin:2px 0 0}
.stage-grid.ultra .duck-wrap{width:92px;height:100px}
.stage-grid.ultra .duck-svg{width:92px;height:92px}
.stage-grid.ultra .ruler{height:100px;width:26px}
.stage-grid.ultra .ruler-track{width:7px;left:2px}
.stage-grid.ultra .ruler-ticks{left:9px}
.stage-grid.ultra .tick{width:7px;height:2px}
.stage-grid.ultra .tick.major{width:11px}
.stage-grid.ultra .tick-label{font-size:8px;left:13px}
.stage-grid.ultra .bean-num{font-size:17px}
.stage-grid.ultra .bean-ico{font-size:11px}
.stage-grid.ultra .bean-den{font-size:10px}
.stage-grid.ultra .bean-row{gap:2px}
.stage-grid.ultra .ctrl-btn{width:26px;height:26px;font-size:12px;border-radius:8px}
.stage-grid.ultra .card-controls{gap:4px;margin-top:4px}
.stage-grid.ultra .group-name-input{width:88px;font-size:12px;padding:2px 4px}

.duck-card{width:100%;max-width:320px;padding:12px 14px 14px;border-radius:24px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);box-shadow:0 10px 26px rgba(120,150,190,.16),inset 0 0 0 2px rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;transition:box-shadow .3s,transform .3s}
.duck-card.grown{box-shadow:0 10px 26px rgba(247,155,18,.3),inset 0 0 0 3px #ffd166;background:linear-gradient(180deg,rgba(255,250,230,.95),rgba(255,255,255,.8))}
.card-head{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;min-height:32px}

.duck-name{font-size:21px;font-weight:900;letter-spacing:1px;color:#2b3440;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:2px 8px;border-radius:10px;border:1px dashed transparent;transition:background .15s,border-color .15s,box-shadow .15s}
.duck-name:hover{background:#fff6de;border-color:#ffd166;box-shadow:0 3px 10px rgba(247,155,18,.2)}

.group-tag{font-size:12px;font-weight:900;color:#94a3b8;background:#eef3f9;padding:3px 8px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;border:1px dashed transparent;white-space:nowrap;line-height:1;user-select:none}
.group-tag:hover{background:#dbe7f5;color:#4f6784;border-color:#b8ccdf}

.group-name-input{width:170px;max-width:200px;padding:4px 10px;border:2px solid #ffc93c;border-radius:10px;font-size:19px;font-weight:900;color:#2b3440;background:#fff;outline:none;text-align:center;box-shadow:0 6px 16px rgba(247,155,18,.3);font-family:inherit}

.duck-stage{display:flex;align-items:flex-end;justify-content:center;gap:0;height:180px;margin:6px 0 2px;position:relative}
.duck-wrap{width:160px;height:170px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.duck-svg{width:160px;height:160px;transform-origin:bottom center;transform:scale(var(--s,.35));transition:transform .85s cubic-bezier(.34,1.56,.64,1)}
.duck-svg svg{width:100%;height:100%;display:block;overflow:visible}

.ruler{position:relative;width:42px;height:170px;flex:none}
.ruler-track{position:absolute;left:2px;top:0;bottom:0;width:9px;background:#e4ecf4;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,150,190,.25)}
.ruler-fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#ffd166,#f79b12);border-radius:6px;transition:height .85s cubic-bezier(.34,1.56,.64,1)}
.ruler-ticks{position:absolute;left:11px;top:0;bottom:0;right:0}
.tick{position:absolute;left:0;width:9px;height:2px;background:#c3d0dd;border-radius:2px}
.tick.major{width:14px;background:#9fb3c8}
.tick-label{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:#a8b6c6;line-height:1}
.tick.major .tick-label{color:#7b8794}

.bean-row{display:flex;align-items:baseline;gap:3px;margin-top:2px}
.bean-ico{font-size:16px}
.bean-num{font-size:28px;font-weight:900;color:#f79b12;letter-spacing:-.5px;transition:transform .25s,color .25s}
.bean-num.bump{animation:beanBump .35s ease}
@keyframes beanBump{0%,100%{transform:scale(1)}40%{transform:scale(1.4);color:#ff7a00}}
.bean-den{font-size:13px;font-weight:700;color:#b8c4d2}

.card-controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.ctrl-btn{width:34px;height:34px;border-radius:11px;font-size:16px;font-weight:900;display:grid;place-items:center;box-shadow:0 3px 8px rgba(120,150,190,.2),inset 0 0 0 1px rgba(255,255,255,.9);transition:transform .12s,box-shadow .12s,filter .12s;user-select:none}
.ctrl-btn:active{transform:scale(.88)}
.ctrl-add{color:#f79b12;background:linear-gradient(135deg,#fff3d6,#ffe9b8)}
.ctrl-puke{background:linear-gradient(135deg,#ffe0e6,#ffc4d0);color:#c9184a;font-size:16px}
.ctrl-feed{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);color:#2e7d32;font-size:16px}
.ctrl-feed.active{background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;animation:feedPulse 1.4s ease-in-out infinite}
@keyframes feedPulse{0%,100%{box-shadow:0 3px 8px rgba(76,175,80,.4)}50%{box-shadow:0 3px 18px rgba(76,175,80,.75)}}

.stu-header{padding:16px 20px 6px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:2px}
.stu-header .brand-duck{font-size:22px}
.stu-refresh{margin-left:auto;width:38px;height:38px;border-radius:12px;font-size:17px;background:rgba(255,255,255,.85);color:#4f6784;box-shadow:0 4px 12px rgba(120,150,190,.2);display:grid;place-items:center;transition:transform .16s}
.stu-refresh:active{transform:scale(.9) rotate(-90deg)}
.stu-refresh.spin{animation:spin .8s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

#groupPicker{padding:10px 20px 30px}
#groupPicker h2{font-size:19px;margin:14px 0 8px;font-weight:800}
.gp-status{font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:16px;line-height:1.6}
.gp-status b{color:#f79b12}
.group-pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.group-pick-btn{padding:16px 12px;border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(120,150,190,.16),inset 0 0 0 2px #fff;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .16s}
.group-pick-btn:active{transform:scale(.95)}
.gp-name{font-size:16px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-meta{font-size:12px;color:#94a3b8;font-weight:600}

#duckSetup,#duckLobby{padding:0 20px 40px;display:flex;flex-direction:column;align-items:center}
.back-btn{align-self:flex-start;font-size:13px;font-weight:700;color:#7b8794;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.7);margin-bottom:10px}
.setup-head{display:flex;align-items:center;width:100%;gap:8px;margin-bottom:8px}
.setup-head .back-btn{margin-bottom:0}
.edit-btn{margin-left:auto;font-size:13px;font-weight:700;color:#4f6784;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(120,150,190,.16)}
.edit-btn:active{transform:scale(.95)}

.setup-duck-stage{display:flex;align-items:flex-end;justify-content:center;height:180px;width:100%;margin-bottom:8px}
.setup-duck-stage .duck-wrap{width:160px;height:170px}
.setup-duck-stage .duck-svg{width:160px;height:160px}
.setup-title{font-size:17px;font-weight:900;color:#2b3440;margin:8px 0 4px;letter-spacing:1px}
.setup-sub{font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:22px}

.my-duck-stage{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:200px;position:relative;width:100%;margin-bottom:2px}
.my-beans{font-size:18px;font-weight:800;color:#f79b12;margin:6px 0 22px;background:rgba(255,255,255,.8);padding:6px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(120,150,190,.14)}

.my-controls{width:100%;display:flex;flex-direction:column;gap:16px;margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:13px;font-weight:700;color:#7b8794;padding-left:4px}
.field input{width:100%;padding:14px 16px;border-radius:16px;border:2px solid #e4ecf4;background:rgba(255,255,255,.9);font-size:17px;font-weight:700;outline:none;transition:border-color .2s}
.field input:focus{border-color:#ffc93c}
.color-row{display:flex;gap:10px;flex-wrap:wrap;padding-left:4px}
.color-dot{width:42px;height:42px;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.12),inset 0 0 0 2px rgba(255,255,255,.7);transition:transform .16s,box-shadow .16s;position:relative}
.color-dot.active{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 6px #ffc93c}

.big-btn{width:100%;padding:20px;border-radius:24px;font-size:19px;font-weight:900;letter-spacing:1px;color:#5a3200;background:linear-gradient(135deg,#ffd166,#f79b12);box-shadow:0 12px 28px rgba(247,155,18,.4);transition:transform .16s,filter .16s,background .2s,color .2s}
.big-btn:active{transform:scale(.96)}
.big-btn:disabled{background:#e4ecf4;color:#a8b6c6;box-shadow:none;transform:none;cursor:default}
.big-btn.gray{background:#e4ecf4;color:#a8b6c6;box-shadow:none}
.big-btn.green{background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;box-shadow:0 12px 28px rgba(67,160,71,.4);animation:btnGlow 1.6s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 12px 28px rgba(67,160,71,.4)}50%{box-shadow:0 12px 36px rgba(67,160,71,.75)}}

/* ===== 盲盒格子界面 ===== */
#boxGridScreen{position:fixed;inset:0;background:linear-gradient(180deg,#bfe6ff 0%,#dff1ff 32%,#fff8e8 100%);z-index:50;padding:24px 20px;display:flex;flex-direction:column;align-items:center;overflow-y:auto}
.box-grid-head{text-align:center;margin:16px 0 22px}
.box-grid-head h2{font-size:22px;font-weight:900;margin:0 0 6px;letter-spacing:2px}
.box-grid-head p{font-size:13px;color:#94a3b8;font-weight:600;margin:0}
.box-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:520px;margin-bottom:22px}
.box-cell{aspect-ratio:1;border-radius:20px;background:linear-gradient(160deg,#ffd166,#f4a261);box-shadow:0 8px 20px rgba(244,162,97,.35),inset 0 -6px 0 rgba(0,0,0,.08);display:grid;place-items:center;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .2s;position:relative;overflow:hidden;font-family:inherit;color:inherit}
.box-cell::before{content:'?';font-size:48px;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 4px 0 rgba(0,0,0,.1)}
.box-cell:active{transform:scale(.94)}
.box-cell.opened{cursor:default;animation:cellOpen .45s ease}
.box-cell.opened::before{display:none}
.box-cell.disabled{pointer-events:none;opacity:.4}
.box-cell.opened.good{background:linear-gradient(160deg,#ffd166,#f79b12);box-shadow:0 8px 20px rgba(247,155,18,.5),inset 0 0 0 3px rgba(255,255,255,.6)}
.box-cell.opened.bad{background:linear-gradient(160deg,#ffb3c1,#ef476f);box-shadow:0 8px 20px rgba(239,71,111,.4),inset 0 0 0 3px rgba(255,255,255,.6)}
.box-cell.opened.empty{background:linear-gradient(160deg,#dde7f0,#b8c4d2);box-shadow:0 8px 20px rgba(150,170,190,.3),inset 0 0 0 3px rgba(255,255,255,.6)}
@keyframes cellOpen{0%{transform:scale(1) rotateY(0)}50%{transform:scale(1.15) rotateY(90deg)}100%{transform:scale(1) rotateY(0)}}
.box-cell .result-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.box-cell .result-icon{font-size:22px;line-height:1}
.box-cell .result-num{font-size:20px;line-height:1;letter-spacing:-1px}
.box-cell .result-txt{font-size:9px;opacity:.9}

.particle{position:absolute;font-size:20px;pointer-events:none;z-index:5;animation:fly .95s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
.puking{animation:pukeShake .8s ease-in-out}
@keyframes pukeShake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-6px) rotate(-4deg)}30%{transform:translateX(6px) rotate(4deg)}45%{transform:translateX(-5px) rotate(-3deg)}60%{transform:translateX(5px) rotate(3deg)}80%{transform:translateX(-2px) rotate(1deg)}}

.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(43,52,64,.92);color:#fff;font-size:14px;font-weight:700;padding:12px 22px;border-radius:999px;z-index:200;animation:toastIn .25s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:520px){
  .stage-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 12px 24px}
  .duck-card{padding:10px 8px 12px;border-radius:18px}
  .duck-name{font-size:15px;max-width:130px}
  .group-tag{font-size:10px}
  .duck-stage{height:150px}
  .duck-wrap{width:120px;height:140px}
  .duck-svg{width:130px;height:130px}
  .ruler{height:140px;width:36px}
  .bean-num{font-size:22px}
  .count-btn{width:48px;height:48px;font-size:18px}
  .ctrl-btn{width:30px;height:30px;font-size:14px}
  .box-cell::before{font-size:36px}
  .box-cell .result-num{font-size:20px}
  .box-cell .result-icon{font-size:22px}
}
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<section id="home" class="screen" hidden>
  <div class="home-inner">
    <div class="logo-duck">&#x1F986;</div>
    <h1>养鸭子</h1>
    <p class="sub">回答问题 · 抽盲盒 · 喂聪明豆 · 看谁的鸭子先长大</p>
    <div class="home-btns">
      <button class="btn btn-primary" id="goStage">&#x1F4FA; 打开大屏</button>
      <button class="btn btn-ghost" id="goStudent">&#x1F4F1; 我是学生</button>
    </div>
  </div>
</section>

<!-- ============ 大屏 ============ -->
<section id="stage" class="screen" hidden>
  <div id="stageSetup" style="display:flex;flex-direction:column;flex:1">
    <div class="home-inner">
      <div class="logo-duck">&#x1F986;</div>
      <h1>养鸭子</h1>
      <p class="sub">请先选择小组数量，然后开始上课</p>
      <div class="count-picker" id="countPicker"></div>
      <button class="btn btn-primary" id="btnStartStage" style="margin-top:24px;min-width:220px">开始上课</button>
    </div>
  </div>

  <div id="stageBoard" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header class="stage-header">
      <div class="brand"><span class="brand-duck">&#x1F986;</span><span>养鸭子</span></div>
      <div class="stage-tools">
        <button class="icon-btn" id="btnSettings" title="设置">&#x2699;&#xFE0F;</button>
      </div>
    </header>
    <div class="settings-panel" id="settingsPanel" hidden>
      <label>小组数量
        <input type="range" id="groupCount" min="2" max="15">
        <span id="groupCountVal"></span>
      </label>
      <button class="btn btn-danger" id="btnClearBeans" style="padding:10px 18px;font-size:14px;border-radius:14px">清空豆子</button>
      <button class="btn btn-danger" id="btnReSetup" style="padding:10px 18px;font-size:14px;border-radius:14px">重新设置组数</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBU16VjvVLIA3nNunyQEXAz1q3cBQsa4BA",
  authDomain: "aaaaaaaa-ac1eb.firebaseapp.com",
  databaseURL: "https://aaaaaaaa-ac1eb-default-rtdb.firebaseio.com",

const app = initializeApp(firebaseConfig);

const $  = (s, r = document) => r.querySelector(s);
const LS_KEY = 'duck-classroom-v2';
const COLORS = [
  '#FFD93D','#FFA45B','#FF8FA3','#7FC8F8','#9BE38B',
  '#C4A7F5','#5EC5C5','#FFD6E8','#FFB3BA','#BAE1FF',
  '#BAFFC9','#FFFFBA','#FFDFBA','#E0BBE4','#A2E1DB'
];
const MAX_BEANS = 20;

const BOX_POOL = [
  { v: -2, w: 4,  type: 'pill', lv: 2 },
  { v: -1, w: 8,  type: 'pill', lv: 1 },
  { v: 0,  w: 10, type: 'empty' },
  { v: 1,  w: 16, type: 'bean' },
  { v: 2,  w: 15, type: 'bean' },
  { v: 3,  w: 12, type: 'bean' },
  { v: 4,  w: 9,  type: 'bean' },
  { v: 5,  w: 7,  type: 'bean' },
  { v: 6,  w: 5,  type: 'bean' },
  { v: 7,  w: 3.5,type: 'bean' },
  { v: 8,  w: 2.5,type: 'bean' },
  { v: 9,  w: 1.5,type: 'bean' }
];

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shade(hex, p){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const adj = v => {
    const out = p >= 0 ? v + (255 - v) * p / 100 : v * (1 + p / 100);
    return Math.max(0, Math.min(255, Math.round(out)));
  };
  return '#' + [adj(r), adj(g), adj(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2000);
}

function duckSVG(color){
  const d1 = shade(color, -16);
  const d2 = shade(color, -30);
  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
    '<ellipse cx="100" cy="186" rx="52" ry="7" fill="rgba(90,120,160,.13)"/>' +
    '<g stroke="rgba(0,0,0,0.10)" stroke-width="3" stroke-linejoin="round">' +
      '<path d="M72 158 L58 188 L90 188 Z" fill="#FFA82E"/>' +
      '<path d="M118 158 L106 188 L138 188 Z" fill="#FFA82E"/>' +
      '<path d="M50 106 Q12 82 22 126 Q28 150 58 140 Z" fill="' + d2 + '"/>' +
      '<ellipse cx="98" cy="128" rx="64" ry="48" fill="' + color + '"/>' +
      '<ellipse cx="86" cy="133" rx="31" ry="22" fill="' + d1 + '"/>' +
      '<circle cx="132" cy="70" r="38" fill="' + color + '"/>' +
      '<path d="M164 62 Q198 72 164 87 Q154 74 164 62 Z" fill="#FFA82E"/>' +
      '<circle cx="143" cy="58" r="7.5" fill="#2b3440" stroke="none"/>' +
      '<circle cx="145.6" cy="55" r="2.6" fill="#ffffff" stroke="none"/>' +
    '</g>' +
  '</svg>';
}

/* ---------- 状态 ---------- */
function makeDefaultState(){
  return { initialized: false, groupCount: 6, groups: [] };
}
function buildGroups(n, old){
  old = old || [];
  const arr = [];
  for (let i = 0; i < n; i++) {
    const prev = old[i];
    if (prev) {
      if (!prev.groupName) prev.groupName = '第' + (i + 1) + '组';
      if (typeof prev.beans !== 'number') prev.beans = 0;
      if (!prev.color) prev.color = COLORS[i % COLORS.length];
      if (typeof prev.duckName !== 'string') prev.duckName = '';
      if (typeof prev.authorized !== 'boolean') prev.authorized = false;
      if (typeof prev.entered !== 'boolean') prev.entered = false;
      arr.push(prev);
    } else {
      arr.push({
        id: 'g' + (i + 1),
        groupName: '第' + (i + 1) + '组',
        duckName: '',
        color: COLORS[i % COLORS.length],
        beans: 0,
        authorized: false,
        entered: false
      });
    }
  }
  return arr;
}

let S = null;
let bc = null;
try { bc = new BroadcastChannel('duck-classroom'); } catch (e) {}

function loadState(){
  return makeDefaultState();
}

function saveState(){
  set(dbRef, S);
}

onValue(dbRef, (snapshot) => {
  const data = snapshot.val();
  if (data) {
    S = data;
    if (myGroupId && S.groups && !S.groups.find(g => g.id === myGroupId)) {
      myGroupId = null;
      boxGridOpen = false;
    }
    render();
    route();
  } else {
    S = makeDefaultState();
    saveState();
  }
});

/* ---------- 路由 ---------- */
function getMode(){
  const h = location.hash.replace('#', '');
  return (h === 'stage' || h === 'student') ? h : 'home';
}
function route(){
  const m = getMode();
  $('#home').hidden    = m !== 'home';
  $('#stage').hidden   = m !== 'stage';
  $('#student').hidden = m !== 'student';

  if (m === 'stage') {
    if (!S.initialized || !S.groups.length) {
      $('#stageSetup').hidden = false;
      $('#stageBoard').hidden = true;
      setupCount = S.groupCount || 6;
      renderCountPicker();
    } else {
      $('#stageSetup').hidden = true;
      $('#stageBoard').hidden = false;
    }
  }
  if (m === 'student' && !S) S = loadState();
  render();
}
window.addEventListener('hashchange', function(){
  builtIds = '';
  myGroupId = null;
  boxGridOpen = false;
  route();
});
$('#goStage').onclick   = function(){ location.hash = 'stage'; };
$('#goStudent').onclick = function(){ location.hash = 'student'; };

/* ---------- 设置组数 ---------- */
let setupCount = 6;
function renderCountPicker(){
  const box = $('#countPicker');
  box.innerHTML = '';
  for (let i = 2; i <= 15; i++) {
    const b = document.createElement('button');
    b.className = 'count-btn' + (i === setupCount ? ' active' : '');
    b.textContent = i;
    b.onclick = function(){ setupCount = i; renderCountPicker(); };
    box.appendChild(b);
  }
}
$('#btnStartStage').onclick = function(){
  S.groupCount = setupCount;
  S.groups = buildGroups(setupCount, []);
  S.initialized = true;
  builtIds = '';
  saveState();
  route();
};

/* ---------- 大屏看板 ---------- */
const cardMap = new Map();
let builtIds = '';

function buildStageCards(){
  const grid = $('#stageGrid');
  grid.innerHTML = '';
  cardMap.clear();
  S.groups.forEach(function(g){
    const el = document.createElement('div');
    el.className = 'duck-card';
    el.dataset.id = g.id;
    el.innerHTML =
      '<div class="card-head">' +
        '<div class="duck-name" title="点击修改组名"></div>' +
        '<div class="group-tag" title="点击修改组名">&#x270E;</div>' +
      '</div>' +
      '<div class="duck-stage">' +
        '<div class="duck-wrap"><div class="duck-svg"></div></div>' +
        '<div class="ruler">' +
          '<div class="ruler-track"><div class="ruler-fill"></div></div>' +
          '<div class="ruler-ticks"></div>' +
        '</div>' +
      '</div>' +
      '<div class="bean-row">' +
        '<span class="bean-ico">&#x1FAD8;</span>' +
        '<span class="bean-num">0</span>' +
        '<span class="bean-den">/20</span>' +
      '</div>' +
      '<div class="card-controls">' +
        '<button class="ctrl-btn ctrl-add"  data-act="add"  data-id="' + g.id + '" title="加1颗豆">+</button>' +
        '<button class="ctrl-btn ctrl-puke" data-act="puke" data-id="' + g.id + '" title="呕吐 -1 颗豆">&#x1F922;</button>' +
        '<button class="ctrl-btn ctrl-feed" data-act="feed" data-id="' + g.id + '" title="放粮：学生可抽盲盒">&#x1F35A;</button>' +
      '</div>';
    const ticks = el.querySelector('.ruler-ticks');
    for (let v = 20; v >= 0; v -= 5) {
      const t = document.createElement('div');
      t.className = 'tick' + (v % 10 === 0 ? ' major' : '');
      t.style.bottom = (v / 20 * 100) + '%';
      const lab = document.createElement('span');
      lab.className = 'tick-label';
      lab.textContent = v;
      t.appendChild(lab);
      ticks.appendChild(t);
    }
    grid.appendChild(el);
    cardMap.set(g.id, el);
  });
}

function updateCard(g){
  const el = cardMap.get(g.id);
  if (!el) return;

  const nameEl = el.querySelector('.duck-name');
  if (nameEl) nameEl.textContent = g.groupName;

  const host = el.querySelector('.duck-svg');
  if (host.dataset.color !== g.color) {
    host.innerHTML = duckSVG(g.color);
    host.dataset.color = g.color;
  }
  const p = Math.min(1, g.beans / MAX_BEANS);
  host.style.setProperty('--s', (0.35 + 0.65 * p).toFixed(3));
  el.querySelector('.ruler-fill').style.height = (p * 100) + '%';
  const numEl = el.querySelector('.bean-num');
  if (numEl.textContent !== String(g.beans)) {
    numEl.textContent = g.beans;
    numEl.classList.remove('bump');
    void numEl.offsetWidth;
    numEl.classList.add('bump');
  }
  el.classList.toggle('grown', g.beans >= MAX_BEANS);

  /* 放粮按钮状态 */
  const feedBtn = el.querySelector('.ctrl-feed');
  if (feedBtn) {
    feedBtn.classList.toggle('active', !!g.authorized);
    feedBtn.title = g.authorized ? '已放粮（点击取消）' : '放粮：学生可抽盲盒';
  }
}

function renderStage(){
  if (!S.groups.length) return;
  const n = S.groups.length;
  const grid = $('#stageGrid');
  grid.classList.toggle('compact', n >= 9 && n < 13);
  grid.classList.toggle('ultra',   n >= 13);

  const key = S.groups.map(function(g){ return g.id; }).join('|');
  if (key !== builtIds) { builtIds = key; buildStageCards(); }
  S.groups.forEach(updateCard);
}

/* ---------- 修改组名 ---------- */
function startEditGroupName(cardEl){
  if (!cardEl) return;
  const gid = cardEl.dataset.id;
  const g = S.groups.find(function(x){ return x.id === gid; });
  if (!g) return;

  const nameEl = cardEl.querySelector('.duck-name');
  if (!nameEl || nameEl.dataset.editing === '1') return;
  nameEl.dataset.editing = '1';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = g.groupName;
  input.maxLength = 10;
  input.className = 'group-name-input';
  input.setAttribute('placeholder', '输入组名');
  nameEl.replaceWith(input);
  setTimeout(function(){ input.focus(); input.select(); }, 0);

  let done = false;
  function commit(save){
    if (done) return;
    done = true;
    const val = input.value.trim().slice(0, 10);
    if (save && val) g.groupName = val;

    const newName = document.createElement('div');
    newName.className = 'duck-name';
    newName.title = '点击修改组名';
    newName.textContent = g.groupName;
    if (input.parentNode) input.replaceWith(newName);

    if (save && val) saveState();
  }
  input.addEventListener('blur', function(){ commit(true); });
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
  });
}

/* ---------- 大屏点击 ---------- */
$('#stageGrid').addEventListener('click', function(e){
  const editTrigger = e.target.closest('.duck-name, .group-tag');
  if (editTrigger) {
    startEditGroupName(editTrigger.closest('.duck-card'));
    return;
  }
  const b = e.target.closest('.ctrl-btn');
  if (!b) return;
  const g = S.groups.find(function(x){ return x.id === b.dataset.id; });
  if (!g) return;
  const act = b.dataset.act;

  if (act === 'add') {
    if (g.beans >= MAX_BEANS) { toast(g.groupName + ' 的鸭子已经满级啦！'); return; }
    g.beans = Math.min(MAX_BEANS, g.beans + 1);
    saveState();
  } else if (act === 'puke') {
    if (g.beans <= 0) { toast(g.groupName + ' 没有豆子可以吐了'); return; }
    g.beans = Math.max(0, g.beans - 1);
    triggerPukeOnStage(g.id);
    saveState();
  } else if (act === 'feed') {
    g.authorized = !g.authorized;
    saveState();
    if (g.authorized) {
      toast('已给「' + g.groupName + '」放粮，学生可以抽盲盒了');
    } else {
      toast('已取消「' + g.groupName + '」的放粮');
    }
  }
});

function triggerPukeOnStage(gid){
  const el = cardMap.get(gid);
  if (!el) return;
  const stage = el.querySelector('.duck-stage');
  const duck  = el.querySelector('.duck-svg');
  if (!stage || !duck) return;
  duck.classList.remove('puking');
  void duck.offsetWidth;
  duck.classList.add('puking');
  setTimeout(function(){ duck.classList.remove('puking'); }, 900);

  const emojis = ['&#x1F922;','&#x1F7E2;','&#x1FAD8;','&#x1F49A;'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = 'calc(50% + 18px)';
    p.style.top  = '38%';
    p.style.setProperty('--dx', (25 + Math.random() * 55) + 'px');
    p.style.setProperty('--dy', (-25 - Math.random() * 55) + 'px');
    p.style.animationDelay = (i * 55) + 'ms';
    stage.appendChild(p);
    setTimeout(function(){ p.remove(); }, 1200);
  }
}

/* ---------- 设置面板 ---------- */
$('#btnSettings').onclick = function(){
  const p = $('#settingsPanel');
  p.hidden = !p.hidden;
  if (!p.hidden) {
    $('#groupCount').value = S.groups.length;
    $('#groupCountVal').textContent = S.groups.length;
  }
};
$('#groupCount').addEventListener('input', function(e){
  $('#groupCountVal').textContent = e.target.value;
});
$('#groupCount').addEventListener('change', function(e){
  const n = parseInt(e.target.value, 10);
  S.groupCount = n;
  S.groups = buildGroups(n, S.groups);
  builtIds = '';
  saveState();
});
$('#btnClearBeans').onclick = function(){
  if (!confirm('确定清空所有豆子？小组和组名会保留。')) return;
  S.groups.forEach(function(g){ g.beans = 0; g.authorized = false; });
  saveState();
  toast('已清空所有豆子');
};
$('#btnReSetup').onclick = function(){
  if (!confirm('确定重新设置小组？当前所有小组数据（含组名）将被清空。')) return;
  S.initialized = false;
  S.groups = [];
  builtIds = '';
  saveState();
  route();
};

/* ---------- 学生端 ---------- */
let myGroupId = null;
let boxGridOpen = false;
let boxResults = [];
let boxDeltas = [];
let boxOpened = -1;

function currentGroup(){
  return S.groups.find(function(g){ return g.id === myGroupId; }) || null;
}

/* 选组 */
function renderGroupPicker(){
  const grid = $('#groupPickGrid');
  const status = $('#gpStatus');
  grid.innerHTML = '';

  if (!S.groups.length) {
    status.innerHTML = '还没有小组，请老师在大屏上设置组数。';
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94a3b8;font-weight:700;padding:40px 20px;line-height:1.7">等待老师在大屏上设置小组…<br><span style="font-size:13px">点右上角 &#x21BB; 刷新</span></div>';
    return;
  }
  status.innerHTML = '当前共有 <b>' + S.groups.length + '</b> 个小组，请选择你的小组：';

  S.groups.forEach(function(g){
    const b = document.createElement('button');
    b.className = 'group-pick-btn';
    b.innerHTML = '<span class="gp-name">' + esc(g.groupName) + '</span>' +
                  '<span class="gp-meta">' + (g.duckName ? '&#x1F986; ' + esc(g.duckName) + ' · ' : '') + g.beans + ' &#x1FAD8;</span>';
    b.onclick = function(){ myGroupId = g.id; boxGridOpen = false; render(); };
    grid.appendChild(b);
  });
}

/* 设置页 */
function renderDuckSetup(){
  const g = currentGroup();
  if (!g) return;

  const host = $('#setupDuckSvg');
  if (host.dataset.color !== g.color) {
    host.innerHTML = duckSVG(g.color);
    host.dataset.color = g.color;
  }
  const p = Math.min(1, g.beans / MAX_BEANS);
  host.style.setProperty('--s', (0.35 + 0.65 * p).toFixed(3));

  const input = $('#duckNameInput');
  if (document.activeElement !== input) input.value = g.duckName || '';

  const row = $('#colorRow');
  row.innerHTML = '';
  COLORS.forEach(function(c){
    const d = document.createElement('button');
    d.className = 'color-dot' + (c.toLowerCase() === g.color.toLowerCase() ? ' active' : '');
    d.style.background = c;
    d.onclick = function(){ g.color = c; saveState(); };
    row.appendChild(d);
  });
}

/* 大厅 */
function renderDuckLobby(){
  const g = currentGroup();
  if (!g) return;

  const host = $('#myDuckSvg');
  if (host.dataset.color !== g.color) {
    host.innerHTML = duckSVG(g.color);
    host.dataset.color = g.color;
  }
  const p = Math.min(1, g.beans / MAX_BEANS);
  host.style.setProperty('--s', (0.35 + 0.65 * p).toFixed(3));
  $('#myRulerFill').style.height = (p * 100) + '%';
  $('#myBeans').textContent = g.beans;

  const btn = $('#btnDraw');
  btn.classList.remove('gray','green');
  if (g.beans >= MAX_BEANS) {
    btn.disabled = true;
    btn.classList.add('gray');
    btn.textContent = '&#x1F393; 这只鸭子已经长大啦！';
  } else if (g.authorized) {
    btn.disabled = false;
    btn.classList.add('green');
    btn.textContent = '&#x1F381; 抽盲盒！';
  } else {
    btn.disabled = true;
    btn.classList.add('gray');
    btn.textContent = '&#x23F3; 等待老师放粮…';
  }
}

/* 盲盒格子 */
function renderBoxGrid(){
  const grid = $('#boxGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const cell = document.createElement('button');
    cell.className = 'box-cell';
    if (boxOpened === i) {
      const roll = boxResults[i];
      const delta = boxDeltas[i];
      let cls = 'opened';
      let inner = '';
      if (roll.type === 'bean') {
        cls += ' good';
        inner = '<div class="result-content"><div class="result-icon">&#x1FAD8;</div><div class="result-num">+' + delta + '</div><div class="result-txt">聪明豆</div></div>';
      } else if (roll.type === 'pill') {
        cls += ' bad';
        inner = '<div class="result-content"><div class="result-icon">&#x1F922;</div><div class="result-num">' + delta + '</div><div class="result-txt">呕吐丸</div></div>';
      } else {
        cls += ' empty';
        inner = '<div class="result-content"><div class="result-icon">&#x1F4E6;</div><div class="result-num">0</div><div class="result-txt">空盒子</div></div>';
      }
      cell.className = 'box-cell ' + cls;
      cell.innerHTML = inner;
      cell.disabled = true;
    } else if (boxOpened >= 0) {
      cell.className = 'box-cell disabled';
      cell.disabled = true;
    } else {
      cell.onclick = (function(idx){
        return function(){ openBoxCell(idx); };
      })(i);
    }
    grid.appendChild(cell);
  }
}
/* 打开格子 */
function openBoxCell(index){
  if (boxOpened >= 0) return;
  const g = currentGroup();
  if (!g) return;

  boxOpened = index;
  const roll = boxResults[index];
  const before = g.beans;
  const after  = Math.max(0, Math.min(MAX_BEANS, before + roll.v));
  const delta  = after - before;
  g.beans = after;
  g.authorized = false; /* 用掉授权 */
  boxDeltas[index] = delta;
  saveState();

  /* 显示收下按钮 */
  $('#btnCollectBox').hidden = false;
}

/* 收下 */
$('#btnCollectBox').onclick = function(){
  const roll = boxResults[boxOpened];
  const isPill = roll && roll.type === 'pill';
  boxGridOpen = false;
  boxOpened = -1;
  boxResults = [];
  boxDeltas = [];
  $('#btnCollectBox').hidden = true;
  render();
  if (isPill) {
    setTimeout(function(){ triggerPuke(); }, 150);
  }
};

/* 学生端渲染 */
function renderStudent(){
  const g = currentGroup();
  const picker = $('#groupPicker');
  const setup  = $('#duckSetup');
  const lobby  = $('#duckLobby');
  const gridSc = $('#boxGridScreen');

  picker.hidden = true;
  setup.hidden = true;
  lobby.hidden = true;
  gridSc.hidden = true;

  if (!g) {
    picker.hidden = false;
    renderGroupPicker();
    return;
  }
  if (boxGridOpen) {
    gridSc.hidden = false;
    renderBoxGrid();
    return;
  }
  if (!g.entered) {
    setup.hidden = false;
    renderDuckSetup();
    return;
  }
  lobby.hidden = false;
  renderDuckLobby();
}

/* 按钮事件 */
$('#btnEnterLobby').onclick = function(){
  const g = currentGroup();
  if (!g) return;
  g.duckName = ($('#duckNameInput').value || '').trim().slice(0, 8);
  g.entered = true;
  saveState();
};

$('#btnEditDuck').onclick = function(){
  const g = currentGroup();
  if (!g) return;
  g.entered = false;
  saveState();
};

$('#btnBack1').onclick = function(){ myGroupId = null; boxGridOpen = false; render(); };
$('#btnBack2').onclick = function(){ myGroupId = null; boxGridOpen = false; render(); };

$('#btnDraw').onclick = function(){
  const g = currentGroup();
  if (!g) return;
  if (g.beans >= MAX_BEANS) { toast('这只鸭子已经长大啦'); return; }
  if (!g.authorized) { toast('老师还没放粮，等等哦～'); return; }

  /* 生成 6 个格子结果 */
  boxResults = [];
  boxDeltas = [];
  for (let i = 0; i < 12; i++) boxResults.push(drawBox());
  boxOpened = -1;
  boxGridOpen = true;
  $('#btnCollectBox').hidden = true;
  render();
};

/* 学生端刷新 */
$('#btnRefresh').onclick = function(){
  const btn = this;
  btn.classList.remove('spin');
  void btn.offsetWidth;
  btn.classList.add('spin');
  if (myGroupId) {
    const g = S.groups.find(function(x){ return x.id === myGroupId; });
    if (!g) { myGroupId = null; boxGridOpen = false; }
  }
  render();
  toast('已刷新');
};

(function initMyRuler(){
  const box = $('#myRulerTicks');
  for (let v = 20; v >= 0; v -= 5) {
    const t = document.createElement('div');
    t.className = 'tick' + (v % 10 === 0 ? ' major' : '');
    t.style.bottom = (v / 20 * 100) + '%';
    const lab = document.createElement('span');
    lab.className = 'tick-label';
    lab.textContent = v;
    t.appendChild(lab);
    box.appendChild(t);
  }
})();

/* ---------- 盲盒概率 ---------- */
function drawBox(){
  const pool = [-2, -1, -1, 0, 1, 1, 1, 3, 4, 5, 6, 7];
  const v = pool[Math.floor(Math.random() * pool.length)];
  if (v < 0) return { v: v, type: 'pill', lv: Math.abs(v) };
  if (v === 0) return { v: 0, type: 'empty' };
  return { v: v, type: 'bean' };
}

/* ---------- 呕吐动画（学生端） ---------- */
function triggerPuke(){
  const stage = $('#myDuckStage');
  const duck  = $('#myDuckSvg');
  if (!stage || !duck) return;
  duck.classList.remove('puking');
  void duck.offsetWidth;
  duck.classList.add('puking');
  setTimeout(function(){ duck.classList.remove('puking'); }, 900);

  const emojis = ['&#x1F922;','&#x1F7E2;','&#x1FAD8;','&#x1F49A;'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = 'calc(50% + 20px)';
    p.style.top  = '38%';
    p.style.setProperty('--dx', (30 + Math.random() * 70) + 'px');
    p.style.setProperty('--dy', (-30 - Math.random() * 70) + 'px');
    p.style.animationDelay = (i * 60) + 'ms';
    stage.appendChild(p);
    setTimeout(function(){ p.remove(); }, 1200);
  }
}

/* ---------- 总渲染 ---------- */
function render(){
  const m = getMode();
  if (m === 'stage') {
    if (S.initialized && S.groups.length) renderStage();
  }
  if (m === 'student') renderStudent();
}

/* ---------- 启动 ---------- */
document.addEventListener('DOMContentLoaded', function(){
  S = loadState();
  route();
});
</script>
</body>
</html>
